# ---------------------------------------------------------------------------
# Image Playground: where a Genmoji is GENERATED. The public `ImagePlayground.framework`
# (macOS 15.1; `ImageCreator`, the headless entry point, 15.4) fronts a Swift-only stack:
# `ImagePlaygroundInternal` drives it and `VisualGeneration` runs the diffusion models. The
# Objective-C runtime sees Swift classes by name only, so most of these headers carry no
# methods; what they settle is PRESENCE per release, and the three `@protocol`s, which are
# the NSXPC interfaces between the host, the Image Playground service and the non-UI
# generation extension (`/System/Library/ExtensionKit/Extensions/GPNonUIExtension.appex`,
# extension point `com.apple.ImagePlayground.NonUIExtension`). `GPNonUIExtension`'s
# `startGenerationWithStyle:promptElements:optionsWrapper:imageIndex:batchID:replyHandler:`
# is the call every headless generation on this Mac goes through, `ImageCreator` included.
#
# Native, not Catalyst: Image Playground.app is a native macOS app, and so is the server.
# On Sonoma none of the three frameworks exists, so every class here reports `NOT PRESENT`:
# the dumper sees the `.framework` folder is missing, prints a `note:` rather than a load
# warning, and that absence is the expected answer, not a broken dump.
group Image Playground
app      com.apple.GenerativePlaygroundApp
platform macos
load     /System/Library/Frameworks/ImagePlayground.framework/ImagePlayground
load     @sys/ImagePlaygroundInternal.framework/ImagePlaygroundInternal
load     @sys/VisualGeneration.framework/VisualGeneration

class    ImagePlayground.ImageCreator
class    ImagePlayground.ImagePlaygroundViewController
class    ImagePlayground.DeviceSupport
class    ImagePlayground.GPHostSideConnectionManager
protocol ImagePlayground.GPNonUIExtension
protocol ImagePlayground.GPServiceProtocol
protocol ImagePlayground.GPHostProtocol
class    ImagePlaygroundInternal.NonUIGenerator
class    ImagePlaygroundInternal.ServiceSideConnectionManager
class    ImagePlaygroundInternal.GPServiceSideExportedObject
class    ImagePlaygroundInternal.DeviceCapabilities
class    ImagePlaygroundInternal.GenerationBlockedAvailabilityService
class    ImagePlaygroundInternal.EmojiImageRenderer
class    ImagePlaygroundInternal.StickerSaver
class    VisualGeneration.KeyboardEmojiGenerator
class    VisualGeneration.GenmojiCacheManager
class    VisualGeneration.ImageGenerator
class    VisualGeneration.GenerativePlayground
