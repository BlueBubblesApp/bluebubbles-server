# ---------------------------------------------------------------------------
# Inline Genmoji. A Genmoji is an ADAPTIVE IMAGE GLYPH: an `NSAdaptiveImageGlyph` (a HEIC
# carrying several strikes plus a content identifier and a description) that Messages sends
# as a file transfer flagged `isAdaptiveImageGlyph`, inline in the text at an attachment
# character. Three layers take part: UIFoundation owns the glyph type, IMSharedUtilities
# models the transfer and the Blastdoor metadata read, ChatKit builds the media object a
# composition carries. Dumped together because sending one crosses all three, and because
# this is the half of Genmoji the Messages process can do; GENERATING one is the Image
# Playground group below. Everything here is `NOT PRESENT` on Sonoma, which is the
# measurement: Genmoji arrived with macOS 15.
group Messages genmoji
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @ios/ChatKit.framework/ChatKit
load     @ios/IMDPersistence.framework/IMDPersistence
load     @sys/UIFoundation.framework/UIFoundation

