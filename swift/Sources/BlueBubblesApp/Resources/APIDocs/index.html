<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlueBubbles API Reference</title>

    <!--
      The page still makes no network requests of its own, and `connect-src 'none'` is what
      guarantees it. That is unchanged by the "Try it" button: every request the API client
      sends is handed to the app over `window.webkit.messageHandlers`, which is a message
      port and not a fetch, so CSP does not apply to it and does not have to be loosened for
      it. See `Views/APIDocsRelay.swift` for why that indirection exists at all.

      The directive is load-bearing for a second reason that has nothing to do with the
      client: Scalar's quickstart configures `proxyUrl: 'https://proxy.scalar.com'` to dodge
      CORS, and this API authenticates with the server password. A relay through a third
      party is not a thing to leave one config key away. `proxyUrl` is unset below, and the
      CSP is the lock that does not depend on anyone noticing that.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' 'unsafe-inline' 'unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'none'"
    />

    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      /* Shown only if the bundle fails to load or the spec never arrived. Styled inline
         because a stylesheet that failed to load cannot report that it failed to load. */
      #fallback {
        font: 13px -apple-system, system-ui, sans-serif;
        color: #888;
        padding: 2rem;
      }
      /* `withDefaultFonts: false` below stops Scalar fetching Inter from
         fonts.scalar.com, which leaves it with no font at all rather than a fallback.
         This supplies one, and the system stack is what the rest of the app renders in. */
      :root {
        --scalar-font: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --scalar-font-code: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* Scalar's "Generate MCP" affordance, which links out to their platform.
         `agent: { disabled: true }` removes "Ask AI" but NOT this, and 1.67.0 exposes no
         config key for it, so it comes out with CSS. This is the one piece of the page a
         version bump can silently undo, which is why it is a Scalar-namespaced class
         rather than one of the utility classes beside it: `.scalar-mcp-layer` is a name
         they chose, so it is the most stable hook on offer. */
      .scalar-mcp-layer {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="app"><p id="fallback">Loading the API reference…</p></div>

    <script src="scalar.standalone.js"></script>
    <script>
      (function () {
        var mount = document.getElementById("app");

        function fail(message) {
          mount.innerHTML = '<p id="fallback"></p>';
          mount.firstChild.textContent = message;
        }

        // Injected by the host as a WKUserScript at document start, so it is always set
        // before this runs. If it is missing, the Swift side failed to generate; say so
        // rather than rendering an empty reference that looks like a server with no routes.
        var spec = window.__BB_OPENAPI_SPEC__;
        if (!spec) {
          fail("The API document was not provided by the app.");
          return;
        }
        if (!window.Scalar || !window.Scalar.createApiReference) {
          fail("The API reference bundle failed to load.");
          return;
        }

        // Everything the API client sends goes through here: `customFetch` is the
        // documented hook for it (config key verified against the bundled 1.67.0), so
        // nothing in the vendored bundle is patched. `bbAPIRelay` is
        // `APIDocsRelay.messageHandlerName`; the two spellings have to match.
        //
        // Scalar calls this with a `Request` outside Electron and with `(url, init)` inside
        // it, so both shapes are normalized before anything reads them. Bodies cross the
        // bridge as base64 because `postMessage` marshals JSON, and JSON has no bytes.
        function relayFetch(input, init) {
          var handler =
            window.webkit &&
            window.webkit.messageHandlers &&
            window.webkit.messageHandlers.bbAPIRelay;
          if (!handler) {
            return Promise.reject(
              new Error("This app is not listening for requests from the reference.")
            );
          }

          var request = input instanceof Request ? input : new Request(input, init);

          return request.arrayBuffer().then(function (body) {
            var headers = [];
            request.headers.forEach(function (value, name) {
              headers.push([name, value]);
            });

            var send = handler.postMessage({
              url: request.url,
              method: request.method,
              headers: headers,
              body: body.byteLength ? toBase64(body) : "",
            });

            // The native request cannot be cancelled from here, so Cancel rejects the
            // promise and lets the reply land on the floor. The console stops waiting,
            // which is what the button means; the request itself finishes unobserved.
            var toResponse = function (reply) {
              return buildResponse(reply, request.url);
            };

            var signal = request.signal;
            if (!signal) return send.then(toResponse);
            return Promise.race([
              send.then(toResponse),
              new Promise(function (_, reject) {
                if (signal.aborted) return reject(signal.reason || new Error("Aborted"));
                signal.addEventListener("abort", function () {
                  reject(signal.reason || new Error("Aborted"));
                });
              }),
            ]);
          });
        }

        // `url` is defined onto the result on purpose. A constructed `Response` has an
        // EMPTY `url` — the property is only populated for one that came from the network —
        // and Scalar reads `new URL(response.url)` to label the response with its path.
        // Without this the send fails with "Failed to construct 'URL': Invalid URL", which
        // names neither this file nor the reason, and the console shows nothing at all.
        function buildResponse(reply, url) {
          var response = new Response(reply.body ? fromBase64(reply.body) : null, {
            status: reply.status,
            statusText: reply.statusText,
            headers: reply.headers,
          });
          Object.defineProperty(response, "url", { value: url });
          return response;
        }

        // Chunked, because `String.fromCharCode.apply` on a megabyte-long argument list
        // overflows the stack. 0x8000 is the usual safe span.
        function toBase64(buffer) {
          var bytes = new Uint8Array(buffer);
          var parts = [];
          for (var i = 0; i < bytes.length; i += 0x8000) {
            parts.push(
              String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
            );
          }
          return btoa(parts.join(""));
        }

        function fromBase64(text) {
          var binary = atob(text);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          return bytes;
        }

        window.Scalar.createApiReference("#app", {
          content: spec,

          // NO proxyUrl. Nothing here needs one: `customFetch` sends every request from the
          // app rather than from the page, so there is no CORS to dodge and no third party
          // to dodge it through. See the CSP note above.
          customFetch: relayFetch,

          // OFF BY DEFAULT IN NAME ONLY: every one of these ships enabled and reaches the
          // network, which is not what an offline viewer embedded in a desktop app should
          // do. Measured against 1.67.0 with the CSP above reporting each violation:
          //
          //   telemetry        defaults to TRUE.
          //   withDefaultFonts defaults to TRUE: 14 requests to fonts.scalar.com.
          //   agent.disabled   "Ask AI" and "Generate MCP", which post to
          //                    api.scalar.com. The switch is `agent: { disabled: true }`
          //                    on the DOCUMENT config; there is also a top-level
          //                    `agentEnabled` and setting it does nothing, which is
          //                    exactly the sort of thing to re-check on a version bump.
          //   showDeveloperTools defaults to "localhost", so a Share/Deploy toolbar
          //                    appears exactly when the server is local, which is always.
          //
          // The CSP blocks all of it regardless. These keys are what stops the UI
          // advertising features that then fail.
          telemetry: false,
          withDefaultFonts: false,
          agent: { disabled: true },
          showDeveloperTools: "never",

          // The client is ON. Both of these default to `false`; they are spelled out
          // because this page used to set them to `true` and the reason no longer holds —
          // `customFetch` above is what makes "Send" work without a proxy.
          //
          // `persistAuth` stays off (its default). The password is prefilled from settings
          // on every open, so writing it to the web view's localStorage would put a second
          // copy of it on disk, outside the settings store, to save nothing.
          hideClientButton: false,
          hideTestRequestButton: false,
          persistAuth: false,

          // Prefilled from the running server's settings, so the console authenticates on
          // the first press instead of asking the operator to go and look up a password the
          // app beside it already knows. `passwordQuery` is preferred over the four other
          // accepted spellings for no reason other than that it is the one the docs use.
          //
          // Injected the same way the document is, at document start. Scalar masks it in
          // the code samples it renders.
          authentication: window.__BB_PREFILL_AUTH__ || undefined,

          // The document is generated in-process and never written to disk, so there is no
          // file for a download button to point at. (`hideDownloadButton` is the deprecated
          // spelling and warns at runtime; this is the current one.)
          documentDownloadType: "none",

          showSidebar: true,
          darkMode: window.matchMedia("(prefers-color-scheme: dark)").matches,
        });
      })();
    </script>
  </body>
</html>
