# ---------------------------------------------------------------------------
group FindMy
app      com.apple.findmy
platform catalyst
load     @sys/FMF.framework/FMF
load     @sys/FMCore.framework/FMCore
load     @sys/FMCoreLite.framework/FMCoreLite
load     @sys/FindMyDevice.framework/FindMyDevice
load     @sys/SPOwner.framework/SPOwner
load     @sys/FindMyLocate.framework/FindMyLocate
# Loaded but nothing is dumped from them: FMIPCore and FMFCore are the app's own
# controllers and are PURE SWIFT — `probe members FMIPCore.FMIPManager` reports 0/0/0.
# They are here so that check can be run, not because there is a header to emit.
load     @sys/FMIPCore.framework/FMIPCore
load     @sys/FMFCore.framework/FMFCore

# FMF is a legacy client on macOS 26 — its daemon endpoint is gone — but its MODEL types are
# still live, and knowing when that changed is worth the four files. See
# docs/PRIVATE_API_SURFACE.md § 7.
class    FMFSession
class    FMFSessionDataManager
class    FMFDevice
class    FMFHandle
class    FMFFence
class    FMFLocation
class    FMFPlacemark
class    FMFSchedule
class    FMFFriendshipRequest
# AirTags and Find My network items.
class    SPOwnerSession
class    SPBeaconManager
class    SPBeacon
class    SPBeaconLocation
class    SPSafeLocation
class    SPLostModeInfo
class    SPCommand
# This Mac's own Find My Mac configuration. Read-only interest — see the warning in
# docs/PRIVATE_API_SURFACE.md § 7 before calling anything on it.
class    FMDFMMManager
class    FMDSharedConfiguration
# The live fence/friendship/location transports are Swift, so these XPC protocols are the
# only machine-readable description of them.
protocol FindMyLocate.FenceServiceDaemonXPC
protocol FindMyLocate.FriendshipServiceClientXPC
protocol FindMyLocate.LocationServiceClientXPC

