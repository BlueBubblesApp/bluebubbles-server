class    STKStickerRepresentation
class    STKStickerAttributionInfo
class    _STKStickerRepresentation
class    _STKSticker
class    _STKStickerRepresentationRole

# ---------------------------------------------------------------------------
# Accounts, aliases, nicknames and the availability lookups.
#
# IDS has no iOSSupport copy, so it is loaded from /System/Library like
# FindMyLocateObjCWrapper above. IMCore pulls it in transitively; named here for the same
# reason IMDPersistence is.
group Messages accounts
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @sys/IDS.framework/IDS

class    IMAccountController
class    IMNicknameController
class    IMHandleAvailabilityManager
class    IDSIDQueryController
# Return values again: `activeIMessageAccount` hands back an IMAccount, `imHandleWithID:`
# and `loginIMHandle` hand back IMHandles.
class    IMAccount
class    IMHandle

# ---------------------------------------------------------------------------
# The inbound-event surface (rung 2 of the observation ladder).
#
# `IMDaemonController` itself is a proxy; the object that takes handlers is what its
# `-listener` returns. A class dump of the controller does not reach that listener, so this
# group answers half the question and `Tools/private-api/probe.sh` has to answer the rest.
group Messages events
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities

class    IMDaemonController
# What `-listener` actually returns — the object carrying `addHandler:` and the
# `account:chat:style:chatProperties:messageReceived:` callbacks. Dumping the controller
# alone answered half the question.
class    _IMLegacyDaemonListener
class    IMDaemonListener
protocol IMDaemonListenerProtocol
# Where `allowHandleIDsForNicknameSharing:onChatGUIDs:fromHandle:forceSend:` is declared.
# Reading it is what settled the argument type in SEQUOIA_COMPATIBILITY.md §5.1.
protocol IMDaemonProtocol
protocol IMDaemonAnyProtocol

