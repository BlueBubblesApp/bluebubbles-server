#  hosts.conf
#  What to dump, and out of which process.
#
#  FORMAT — one directive per line, blank lines and # comments ignored:
#
#     group    <Name>                 starts a new group; everything after belongs to it
#     app      <bundle-id>            the host app this group is dumped for (optional)
#     platform macos|catalyst         fallback when the app is absent or unreadable
#     load     <framework path>       dlopen before dumping; @sys/, @ios/ and @iosfw/ (public
#                                     iOSSupport frameworks, e.g. Messages.framework) expand
#     class    <ClassName>            emit ClassName.h
#     protocol <ProtocolName>         emit ProtocolName.h
#
#  THE `app` LINE IS THE IMPORTANT ONE. dump-headers.sh reads that app's Mach-O to find out
#  whether it is a Catalyst or a native macOS binary, and builds the dumper to match, because
#  the two see different copies of several private frameworks. `platform` is only consulted
#  when the app is not installed. See docs/private-api/macos-versions.md.
#
#  A class that does not exist on your macOS is not an error — it is the answer, and it is
#  written to the header as a NOT PRESENT comment. Add names freely.

# ---------------------------------------------------------------------------
group Messages chat
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @ios/ChatKit.framework/ChatKit

class    IMChat
class    IMChatRegistry
class    IMChatInfo
class    IMMutedChatList
class    IMPinnedConversationsController

# ---------------------------------------------------------------------------
# Everything the send paths go through. Split from `Messages chat` because it is a
# different question — that group answers "what can we do to a conversation", this one
# answers "what does it take to put a message in one" — and because ChatKit's compositions
# and IMCore's transfer machinery move independently of IMChat.
#
# IMDPersistence is loaded explicitly. IMCore links it transitively today, so
# IMDPersistentAttachmentController resolves without this line — but a release where that
# stops being true would report the class as absent, which is the exact false negative
# docs/headers/README.md exists to prevent.
group Messages send
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @ios/ChatKit.framework/ChatKit
load     @ios/IMDPersistence.framework/IMDPersistence

class    CKChatController
class    CKComposition
class    CKConversationList
class    CKMediaObjectManager
class    IMMessage
class    IMChatHistoryController
class    IMFileTransferCenter
class    IMDPersistentAttachmentController
class    IMAggregateAttachmentMessagePartChatItem
# Reached only as RETURN VALUES — they never appear as a class name in the helper source,
# which is why the first sweep of `Helper/` missed them. See SEQUOIA_COMPATIBILITY.md §5.4.
class    CKConversation
class    CKMediaObject
class    IMMessageItem
class    IMFileTransfer

# ---------------------------------------------------------------------------
# Stickers. A sticker is an ASSOCIATED message (type 1000) whose payload is a file
# transfer flagged `isSticker`, positioned over its parent part by the `stickerUserInfo`
# dictionary. Three layers take part: IMSharedUtilities models the sticker and the tapback
# it becomes, IMCore carries the associated chat item, and ChatKit wraps the transfer in a
# media object and a composition. Dumped together because a sticker send crosses all
# three, and a class moving in any one of them breaks the same feature.
group Messages stickers
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @ios/ChatKit.framework/ChatKit

# The model. `userInfoDictionaryWithLayoutIntent:…` builds the `stickerUserInfo` that
# chat.db stores on the attachment row; `IMStickerTapback` is what a sticker becomes when
# it is sent as a reaction (`messageForChat:messageGUID:messagePartRange:…`).
class    IMSticker
class    IMEmojiSticker
class    IMStickerPack
class    IMTapback
class    IMStickerTapback
# The transcript side: what a received sticker is, and its parent part.
class    IMAssociatedMessageChatItem
class    IMAssociatedStickerChatItem
class    IMMessagePartChatItem
# ChatKit's wrappers. `CKMediaObjectManager` (group `Messages send`) has the
# `mediaObjectWithSticker:stickerUserInfo:` and `transferWithStickerFileURL:…` factories.
class    CKStickerMediaObject
class    CKAnimatedStickerMediaObject
class    CKImageMediaObject
class    CKAssociatedStickerChatItem
class    CKStickerReactionSession
class    CKCoreChatController

# ---------------------------------------------------------------------------
# Tapbacks. A standard tapback is an IMTapback (group `Messages stickers` has it, since a
# sticker can be one); an emoji tapback is its subclass, sent through ChatKit's
# `-[IMChat(CKMessageAcknowledgment) sendTapback:forChatItem:]`, which wants a CKChatItem
# wrapped around the IMCore part item.
group Messages tapbacks
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @ios/ChatKit.framework/ChatKit

class    IMEmojiTapback
class    CKChatItem
class    CKMessagePartChatItem
class    IMMessageAcknowledgmentChatItem
# What ChatKit hands the tapback to. `+[IMChat configureMessageSummaryInfoForChatItem:]`
# builds the summary the sender takes.
class    IMTapbackSender

# ---------------------------------------------------------------------------
# Send Later and polls. Scheduled messages are ordinary IMMessages with a schedule type and
# state, driven from IMChat's scheduled-message selectors; the ChatKit plugin info is what
# the compose sheet attaches. Polls are a macOS 26 balloon plugin with an IMCore helper.
group Messages sendlater
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/IMSharedUtilities.framework/IMSharedUtilities
load     @ios/ChatKit.framework/ChatKit

class    CKSendLaterPluginInfo
class    CKScheduledUpdater
class    IMScheduledSectionDateChatItem
class    IMPollHelper
class    IMPollOption
# The balloon payload a poll (and every iMessage app message) travels as, and the plugin
# registry that knows the Polls extension.
class    IMPluginPayload
class    IMBalloonPluginManager
class    IMBalloonAppExtension

# ---------------------------------------------------------------------------
# The public iMessage-app API, which is how a poll (or any app balloon) is composed
# before ChatKit turns it into an IMPluginPayload. Messages.framework is iOSSupport only.
group Messages apps
app      com.apple.MobileSMS
platform catalyst
load     @ios/IMCore.framework/IMCore
load     @ios/ChatKit.framework/ChatKit
load     @iosfw/Messages.framework/Messages

class    MSMessage
class    MSSession
class    MSMessageTemplateLayout
class    MSMessageLiveLayout
class    MSMessageLayout
# A vote on a poll is a custom acknowledgement: the extension sends one through
# MSConversation, and ChatKit turns it into IMMessage type 4000.
class    MSConversation
class    _MSMessageCustomAcknowledgement

# ---------------------------------------------------------------------------
# The sticker LIBRARY — the drawer of stickers a user has saved, as opposed to a sticker
