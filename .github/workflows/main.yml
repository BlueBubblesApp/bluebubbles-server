name: Build-BlueBubbles-Server (Electron)

# The Electron server moved to electron/ when the Swift server became the repository
# root. It is still maintained and still cuts releases, because the Swift server needs
# macOS 14 and the Electron one reaches further back. This workflow is unchanged apart
# from being pointed at that directory, and the paths filter keeps it from rebuilding
# the Electron app on every Swift commit.

on:
  push:
    branches: [ master ]
    paths:
      - 'electron/**'
      - '.github/workflows/main.yml'

defaults:
  run:
    working-directory: electron

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-13]
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Node.js 20.11
        uses: actions/setup-node@v4
        with:
          node-version: '20.11'
      - name: Install Dependencies
        run: npm install
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Every path here is quoted. `$RUNNER_TEMP` carries no spaces on GitHub's images
          # today, so this is not a bug being fixed but one being prevented, in a script
          # whose failure mode is a signing step misbehaving on a runner image nobody chose.
          # The profile directory genuinely does contain a space, and it is now a variable
          # rather than a backslash escape repeated twice.
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # apply provisioning profile
          mkdir -p "$PROFILES"
          cp "$PP_PATH" "$PROFILES"
      - name: Build & Publish BlueBubbles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
