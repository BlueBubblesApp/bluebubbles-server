name: Swift - Release

# Cuts a release from a `vX.Y.Z` tag: universal build, signed, notarized, stapled, packaged
# as a DMG, with a signed appcast entry and a DRAFT GitHub release.
#
# Draft rather than published, matching the Node workflow's `releaseType: "draft"`: a human
# still presses the button.
#
# The existing Node workflow (main.yml) is untouched and can release independently while both
# servers coexist.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.2.3'
        required: true

concurrency:
  # Never two releases for one tag at once. Cancel-in-progress is deliberately OFF: a
  # half-finished release that has already submitted to Apple should finish, not be killed.
  group: swift-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: swift

jobs:
  # ---------------------------------------------------------------------------------------
  # Everything that can reject the release runs FIRST, before any secret is touched and
  # before Apple sees anything. A tag that should not have been pushed fails here in seconds.
  # ---------------------------------------------------------------------------------------
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check needs history. A shallow clone makes `merge-base` fail on
          # every tag, which would look like the guard working when it is merely broken.
          fetch-depth: 0

      - name: Resolve the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: The tag must be an ancestor of the default branch
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT" --depth=0

          # Without this, anyone able to push a tag can ship arbitrary code: a tag on a
          # feature branch would build and release code that never passed review.
          if ! git merge-base --is-ancestor "$TAG" "origin/$DEFAULT"; then
            echo "::error::$TAG is not an ancestor of $DEFAULT."
            echo "::error::Tags must be cut from the default branch. Merge first, then tag."
            exit 1
          fi
          echo "$TAG is an ancestor of $DEFAULT."

      - name: The tag must match Packaging/VERSION
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          FILE_VERSION="$(tr -d '[:space:]' < Packaging/VERSION)"

          # The bundle takes its version from this file, so a disagreement ships a DMG named
          # for one version containing another, and Sparkle then offers an update that
          # installs to a version the user already has.
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION, Packaging/VERSION says $FILE_VERSION."
            echo "::error::Update Packaging/VERSION on the default branch, then re-tag."
            exit 1
          fi
          echo "Tag and Packaging/VERSION agree on $TAG_VERSION."

  # ---------------------------------------------------------------------------------------
  # The gate, re-run against the tagged commit. The PR check ran against a merge commit,
  # which is not what is being shipped.
  # ---------------------------------------------------------------------------------------
  # The SAME gate a pull request runs, not an abbreviation of it. This job used to be a
  # plain `swift build` and `swift test` with none of the strict flags, no lint, no
  # package-graph check and none of the generated-artifact checks: one of the five, on the
  # one build that ships. `swift-gate.yml` is now the single definition and both workflows
  # call it, so the release cannot quietly hold itself to a lower bar than the PR did.
  gate:
    name: Gate
    needs: verify
    uses: ./.github/workflows/swift-gate.yml

  release:
    name: Build, sign, notarize
    needs: [verify, gate]
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.3.app

      # -------------------------------------------------------------------------------
      # Signing identity, in a temporary keychain that is deleted at the end of the job.
      # Carried over from the Node workflow, which is sound, minus the provisioning
      # profile, which Developer ID direct distribution does not use.
      # -------------------------------------------------------------------------------
      - name: Import the Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -s SETS the search list. The default keychain must be re-listed alongside it or
          # nothing else on the runner can reach its own keychain items.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            exit 1
          fi
          # Written to the environment, not echoed: the identity string contains the team ID.
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported a Developer ID Application identity."

      - name: Build the app
        env:
          # Baked into Info.plist as SUPublicEDKey. Derived from the private key rather than
          # stored separately, so the two cannot drift: a mismatch here means every shipped
          # install rejects every future update.
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          # Assigned and exported on SEPARATE lines, deliberately. `export VAR="$(cmd)"` is a
          # single command whose exit status is `export`'s, not the substitution's, so under
          # `set -e` a failing `bb-appcast public-key` left the key empty and the build carried
          # on. A plain assignment DOES take the substitution's status, so this stops here.
          SPARKLE_PUBLIC_KEY="$(swift run bb-appcast public-key)"
          export SPARKLE_PUBLIC_KEY
          # And the belt to that brace: the build refuses an empty key rather than noting it.
          # Either failure alone used to ship installs that can never auto-update.
          Packaging/build-app.sh --output "$RUNNER_TEMP/package" --require-sparkle-key

      - name: Sign
        run: |
          Packaging/sign-app.sh \
            --app "$RUNNER_TEMP/package/BlueBubbles.app" \
            --identity "$SIGNING_IDENTITY"

      - name: Notarize and staple
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          Packaging/notarize-app.sh --app "$RUNNER_TEMP/package/BlueBubbles.app"

      - name: Build the DMG
        id: dmg
        run: |
          # `--require-layout` fails the release if Finder could not arrange the window,
          # rather than shipping an image that opens as a plain two-row list with no
          # indication the app is meant to be dragged into Applications.
          # `--require-signature` fails it if the payload is unsigned, which on this path
          # could only mean the signing step above silently did nothing. See make-dmg.sh.
          DMG="$(Packaging/make-dmg.sh \
            --app "$RUNNER_TEMP/package/BlueBubbles.app" \
            --output "$RUNNER_TEMP/package/BlueBubbles-${{ needs.verify.outputs.version }}.dmg" \
            --require-layout \
            --require-signature \
            | tail -1)"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      # The DMG is signed AND notarized. Gatekeeper assesses a signed image on open exactly
      # as it assesses an app on launch, and a signed-but-unnotarized image is refused with
      # the same "damaged" dialog (measured with `spctl --type open`: `Unnotarized Developer
      # ID`). The app inside already carries its own stapled ticket from the step above; this
      # gives the download one too.
      - name: Sign the DMG
        run: |
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "${{ steps.dmg.outputs.path }}"
          codesign --verify --verbose=2 "${{ steps.dmg.outputs.path }}"

      - name: Notarize and staple the DMG
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          Packaging/notarize-app.sh --app "${{ steps.dmg.outputs.path }}"

      # The release notes are written ONCE, here, and both the appcast and the GitHub
      # release use them: Sparkle's update window shows what the release page shows.
      # GitHub generates them from the merged pull requests since the previous tag, and
      # GitHub renders the Markdown to HTML too, so no converter is installed on the runner.
      - name: Write the release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ needs.verify.outputs.tag }}" \
            --jq .body > "$RUNNER_TEMP/notes.md"
          gh api --method POST /markdown \
            -f mode=gfm -f context="${{ github.repository }}" \
            -F text=@"$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes.html"
          # An empty page would render as an empty update window, which reads as broken;
          # the release still ships, with the history link as the notes.
          if [ ! -s "$RUNNER_TEMP/notes.html" ]; then
            echo "::warning::GitHub produced no release notes for this tag"
            rm -f "$RUNNER_TEMP/notes.html"
          fi
          echo "markdown=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          echo "html=$RUNNER_TEMP/notes.html" >> "$GITHUB_OUTPUT"

      - name: Update the appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          TAG="${{ needs.verify.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/BlueBubbles-$VERSION.dmg"

          EXTRA_ARGS=()
          if [ -f "${{ steps.notes.outputs.html }}" ]; then
            EXTRA_ARGS+=(--notes "${{ steps.notes.outputs.html }}")
          fi
          # A pre-release version (anything with a hyphen: 1.3.0-beta.1) goes on the beta
          # channel, which only installs with Receive Beta Releases on ever see. A release
          # carries no channel and reaches everyone, beta testers included.
          case "$VERSION" in
            *-*) EXTRA_ARGS+=(--channel beta) ;;
          esac
          swift run bb-appcast add \
            --appcast ../appcast.xml \
            --short-version "$VERSION" \
            --artifact "${{ steps.dmg.outputs.path }}" \
            --url "$URL" \
            --full-release-notes-link "https://github.com/${{ github.repository }}/releases" \
            "${EXTRA_ARGS[@]}"

          # Verified against the PUBLIC key before anything is published. A signature that
          # does not verify produces a release nobody can auto-update to, and the symptom
          # appears weeks later with nothing in any log.
          swift run bb-appcast verify \
            --appcast ../appcast.xml \
            --artifact "${{ steps.dmg.outputs.path }}" \
            --public-key "$(swift run bb-appcast public-key)"


      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=()
          case "${{ needs.verify.outputs.version }}" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac
          gh release create "${{ needs.verify.outputs.tag }}" \
            "${{ steps.dmg.outputs.path }}" \
            --draft \
            --title "BlueBubbles Server ${{ needs.verify.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.markdown }}" \
            "${PRERELEASE[@]}" \
            --repo "${{ github.repository }}"

      # Ordered AFTER the release is drafted on purpose; see the step below for why.
      - name: Commit the appcast
        run: |
          cd ..
          DEFAULT="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          # Pushed to the default branch, not to the tag: the tag is immutable and the feed
          # has to be readable at a stable URL.
          if git diff --cached --quiet; then
            echo "The appcast did not change."
            exit 0
          fi
          git commit -m "chore: appcast for ${{ needs.verify.outputs.tag }}"

          # REBASE, DO NOT PUSH A DETACHED HEAD STRAIGHT AT THE BRANCH.
          #
          # This job runs from a detached checkout of the tag, and `verify` proves the tag is
          # an ANCESTOR of the default branch, not that it is the tip. So the ordinary
          # sequence -- tag, merge one more PR, release -- makes a bare
          # `push HEAD:$DEFAULT` a non-fast-forward rejection. It used to sit before the
          # release was drafted, so that rejection burned both Apple submissions and drafted
          # nothing, for a reason that has nothing to do with the build.
          #
          # Retried because the window is real: someone can land a commit between the fetch
          # and the push.
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT"
            if git rebase "origin/$DEFAULT"; then
              if git push origin "HEAD:$DEFAULT"; then
                echo "Appcast pushed to $DEFAULT on attempt $attempt."
                exit 0
              fi
            else
              # A conflict in a generated feed is not something a retry fixes.
              git rebase --abort || true
              echo "::error::The appcast conflicts with $DEFAULT. Resolve it by hand."
              exit 1
            fi
            echo "Push rejected; $DEFAULT moved. Retrying."
          done
          # The release is already drafted and the artifacts are attached, so this is a
          # recoverable failure: commit the feed by hand rather than re-notarizing.
          echo "::error::Could not push the appcast after three attempts. The release is"
          echo "::error::drafted and its artifacts are uploaded; add appcast.xml by hand."
          exit 1
      - name: Clean up the keychain
        if: always()
        run: |
          # `always()`, so a failed notarization does not leave a signing identity unlocked
          # on the runner.
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
