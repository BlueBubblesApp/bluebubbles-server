name: Find My regressions

on:
  push:
    paths:
      - '.github/workflows/findmy-regressions.yml'
      - 'packages/server/scripts/test-findmy*.js'
      - 'packages/server/scripts/verify-typescript-config.js'
      - 'packages/server/scripts/verify-findmy-helper.sh'
      - 'packages/server/src/**'
      - 'packages/server/appResources/private-api/**'
      - 'packages/server/tsconfig.json'
      - 'packages/ui/tsconfig.json'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - '.github/workflows/findmy-regressions.yml'
      - 'packages/server/scripts/test-findmy*.js'
      - 'packages/server/scripts/verify-typescript-config.js'
      - 'packages/server/scripts/verify-findmy-helper.sh'
      - 'packages/server/src/**'
      - 'packages/server/appResources/private-api/**'
      - 'packages/server/tsconfig.json'
      - 'packages/ui/tsconfig.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        typescript: ['4.9.5', '5.5.2']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.11.1'
          package-manager-cache: false
      - name: Install only the native-free regression dependencies
        run: >-
          npm install --prefix "$RUNNER_TEMP/bluebubbles-regressions"
          --ignore-scripts --no-save --no-audit --no-fund
          typescript@${{ matrix.typescript }} koa-router@12.0.1
      - name: Verify compiler options against the installed compiler
        env:
          NODE_PATH: ${{ runner.temp }}/bluebubbles-regressions/node_modules
        run: node packages/server/scripts/verify-typescript-config.js
      - name: Run the actual source regressions without launching the app
        env:
          NODE_PATH: ${{ runner.temp }}/bluebubbles-regressions/node_modules
        run: npm --prefix packages/server run test:findmy

  embedded-helper:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify checksum, both architectures, and library identity
        working-directory: packages/server
        run: ./scripts/verify-findmy-helper.sh
